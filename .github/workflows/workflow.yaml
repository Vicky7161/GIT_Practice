name: my-workflow
on: [workflow_dispatch, push]
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: first-step
        run: echo "Hello World"
      - name: github checkout
        uses: actions/checkout@v6
  second-job:
    needs: first-job
    runs-on: ubuntu-latest
    steps:
      - name: test-step
        run: echo "This is a test step"
      - name: test-code
        uses: actions/checkout@v6
